<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f172a'/%3E%3Ctext x='50%25' y='58%25' font-size='100' text-anchor='middle' fill='%2338bdf8' font-family='system-ui'%3ET%3C/text%3E%3C/svg%3E">
<title>Travel OS</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dexie@4/dist/dexie.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f2f4f8; --bg-card: #ffffff; --bg-elevated: #ffffff; --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
    --border: #e2e8f0; --primary: #0284c7; --primary-soft: #e0f2fe; --danger: #dc2626; --danger-soft: #fee2e2;
    --success: #16a34a; --success-soft: #dcfce7; --warning: #d97706; --warning-soft: #fef3c7;
    --nav-bg: rgba(255,255,255,.92); --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --radius: 16px; --radius-sm: 10px; --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #0b1120; --bg-card: #111827; --bg-elevated: #1e293b; --text: #f1f5f9; --text-2: #94a3b8; --text-3: #64748b;
    --border: #1e293b; --primary: #38bdf8; --primary-soft: #0c4a6e; --danger: #f87171; --danger-soft: #450a0a;
    --success: #4ade80; --success-soft: #052e16; --warning: #fbbf24; --warning-soft: #451a03;
    --nav-bg: rgba(11,17,32,.92); --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { padding-bottom: calc(64px + var(--safe-bottom)); }
  button, input, select, textarea { font-family: var(--font); font-size: 15px; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); outline: none; -webkit-appearance: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  textarea { min-height: 70px; resize: vertical; }
  .app { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top, 0px)) 0 8px; position: sticky; top: 0; z-index: 100; background: var(--bg); }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .brand span { color: var(--primary); }
  .page { padding-top: 6px; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card-title { font-size: 16px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--text-2); font-size: 13px; }
  .tiny { color: var(--text-3); font-size: 11px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  html[data-theme="dark"] .btn-primary { color: #0b1120; }
  .btn-danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--primary); padding: 8px 6px; }
  .btn-sm { padding: 7px 10px; font-size: 13px; border-radius: 9px; }
  .btn:active { transform: scale(.97); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); white-space: nowrap; }
  .chip-warn { background: var(--warning-soft); color: var(--warning); }
  .chip-danger { background: var(--danger-soft); color: var(--danger); }
  .chip-success { background: var(--success-soft); color: var(--success); }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); }
  .nav-inner { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: repeat(5,1fr); }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 0 6px; font-size: 10px; font-weight: 600; color: var(--text-3); }
  .nav-item.active { color: var(--primary); }
  .nav-item svg { width: 22px; height: 22px; }
  .progress { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .progress > div { height: 100%; border-radius: 99px; background: var(--primary); transition: width .3s ease; }
  .progress.warn > div { background: var(--warning); }
  .progress.danger > div { background: var(--danger); }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border); border-radius: 2px; }
  .tl-item { position: relative; margin-bottom: 12px; }
  .tl-dot { position: absolute; left: -19px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--primary); }
  .tl-item.done .tl-dot { background: var(--success); box-shadow: 0 0 0 1px var(--success); }
  .tl-item.done .tl-title { text-decoration: line-through; opacity: .6; }
  .tl-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px; }
  .tl-title { font-weight: 700; font-size: 15px; margin: 0 0 3px; }
  .tl-meta { font-size: 12px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .empty { text-align: center; padding: 28px 12px; color: var(--text-3); font-size: 14px; }
  .modal-mask { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .15s ease; }
  .modal { background: var(--bg-card); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + var(--safe-bottom)); animation: slideUp .2s ease; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-head h3 { margin: 0; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .check-row:last-child { border-bottom: none; }
  .check-box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; color: #fff; }
  .check-box.on { background: var(--success); border-color: var(--success); }
  .expense-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .expense-item:last-child { border-bottom: none; }
  .cat-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .amount-expense { color: var(--danger); font-weight: 700; }
  .amount-income { color: var(--success); font-weight: 700; }
  #map { height: 380px; border-radius: var(--radius); overflow: hidden; background: var(--bg-elevated); z-index: 1; }
  .leaflet-popup-content { font-family: var(--font); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: calc(82px + var(--safe-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 900; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--bg-elevated); border: 1px solid var(--border); white-space: nowrap; color: var(--text-2); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  html[data-theme="dark"] .tab.active { color: #0b1120; }
  .stat { text-align: center; padding: 10px 6px; background: var(--bg-elevated); border-radius: 12px; }
  .stat b { display: block; font-size: 18px; margin-bottom: 2px; }
  .stat span { font-size: 11px; color: var(--text-2); }
  .warn-box { border-left: 3px solid var(--warning); background: var(--warning-soft); padding: 10px 12px; border-radius: 8px; font-size: 12px; color: var(--text); margin-bottom: 10px; }
  .danger-box { border-left: 3px solid var(--danger); background: var(--danger-soft); padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
  @media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } .app { padding: 0 12px; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ==================== 数据库层 ==================== */
const db = new Dexie('TravelOSDB');
db.version(1).stores({
  trips: '++id, name, startDate, endDate, createdAt',
  itineraries: '++id, tripId, date, sortOrder, completed',
  expenses: '++id, tripId, date, category, paymentMethod, type, createdAt',
  checklists: '++id, tripId, category, done',
  hotels: '++id, tripId',
  transports: '++id, tripId',
  settings: 'key'
});

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtMoney = n => '¥' + (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

function dateRange(start, end) {
  const out = []; const d = new Date(start + 'T12:00:00'); const e = new Date(end + 'T12:00:00');
  while (d <= e) { out.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); }
  return out;
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

/* ==================== 示例数据初始化 ==================== */
async function seedIfEmpty() {
  const count = await db.trips.count();
  if (count > 0) return;
  const id = await db.trips.add({
    name: '港珠澳广州 5 日 4 晚',
    destination: '香港、珠海、澳门、广州',
    startDate: '2027-01-06', endDate: '2027-01-10',
    budget: 1300, currency: 'CNY',
    members: '我',
    cover: '🌏',
    notes: '预算不含沈阳至香港、广州至乌鲁木齐两段机票。住宿参考：珠海拱北如家 Neo；广州公园前附近。',
    lat: 22.2710, lng: 113.5767,
    createdAt: Date.now()
  });
  await db.settings.put({ key: 'currentTripId', value: id });
  await db.settings.put({ key: 'theme', value: 'auto' });
  const cats = ['证件','衣物','电子设备','日用品','药品','旅行资料','其他'];
  for (const c of cats) await db.checklists.add({ tripId: id, text: c === '证件' ? '港澳通行证及签注' : '', category: c, done: 0 });
}

/* ==================== 通用 UI ==================== */
function Icon({ name }) {
  const p = {
    home: 'M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
    calendar: 'M7 2v3M17 2v3M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
    wallet: 'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7h18M16 12h2',
    map: 'M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3zM9 3v15M15 6v15',
    user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'
  }[name];
  return React.createElement('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', width: 22, height: 22 },
    React.createElement('path', { d: p }));
}

function Toast({ msg }) {
  if (!msg) return null;
  return React.createElement('div', { className: 'toast' }, msg);
}

function Modal({ title, children, onClose, width }) {
  return React.createElement('div', { className: 'modal-mask', onClick: e => { if (e.target === e.currentTarget) onClose(); } },
    React.createElement('div', { className: 'modal', style: width ? { maxWidth: width } : null },
      React.createElement('div', { className: 'modal-head' },
        React.createElement('h3', null, title),
        React.createElement('button', { className: 'btn btn-sm', onClick: onClose }, '关闭')),
      children));
}

function Field({ label, children }) {
  return React.createElement('div', { className: 'field' },
    React.createElement('label', null, label), children);
}

/* ==================== 应用根组件 ==================== */
function App() {
  const [tab, setTab] = useState('home');
  const [trip, setTrip] = useState(null);
  const [trips, setTrips] = useState([]);
  const [theme, setTheme] = useState('auto');
  const [toast, setToast] = useState('');
  const [ready, setReady] = useState(false);
  const toastTimer = useRef();

  const showToast = useCallback(msg => {
    setToast(msg); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2200);
  }, []);

  const applyTheme = useCallback(t => {
    const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b1120' : '#f2f4f8');
  }, []);

  const loadAll = useCallback(async () => {
    await seedIfEmpty();
    const ts = await db.trips.toArray();
    ts.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
    setTrips(ts);
    const cur = await db.settings.get('currentTripId');
    let active = ts.find(t => t.id === cur?.value) || ts[0] || null;
    if (active) await db.settings.put({ key: 'currentTripId', value: active.id });
    setTrip(active);
    const th = await db.settings.get('theme');
    const t = th?.value || 'auto'; setTheme(t); applyTheme(t);
    setReady(true);
  }, [applyTheme]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const switchTrip = async id => {
    const t = await db.trips.get(id);
    if (!t) return;
    setTrip(t);
    await db.settings.put({ key: 'currentTripId', value: id });
    showToast('已切换旅行');
  };

  const changeTheme = async t => {
    setTheme(t); applyTheme(t);
    await db.settings.put({ key: 'theme', value: t });
  };

  if (!ready) return React.createElement('div', { className: 'empty', style: { paddingTop: 120 } }, '正在加载 Travel OS…');

  const pages = {
    home: React.createElement(Home, { trip, trips, onSwitch: switchTrip, showToast, onGo: setTab, onReload: loadAll }),
    itinerary: React.createElement(Itinerary, { trip, showToast }),
    expenses: React.createElement(Expenses, { trip, showToast }),
    map: React.createElement(MapPage, { trip, showToast }),
    profile: React.createElement(Profile, { trip, trips, theme, changeTheme, showToast, onReload: loadAll, onSwitch: switchTrip })
  };

  const navItems = [
    { id: 'home', label: '首页', icon: 'home' },
    { id: 'itinerary', label: '行程', icon: 'calendar' },
    { id: 'expenses', label: '记账', icon: 'wallet' },
    { id: 'map', label: '地图', icon: 'map' },
    { id: 'profile', label: '我的', icon: 'user' }
  ];

  return React.createElement(React.Fragment, null,
    React.createElement('div', { className: 'app' },
      React.createElement('div', { className: 'top-bar' },
        React.createElement('div', { className: 'brand' }, 'Travel', React.createElement('span', null, 'OS')),
        React.createElement('div', { className: 'row', style: { gap: 8 } },
          React.createElement('span', { className: 'chip' }, trip ? trip.name.slice(0, 12) : '无旅行'))),
      React.createElement('div', { className: 'page' }, pages[tab])),
    React.createElement('nav', { className: 'nav' },
      React.createElement('div', { className: 'nav-inner' },
        navItems.map(n => React.createElement('button', { key: n.id, className: 'nav-item' + (tab === n.id ? ' active' : ''), onClick: () => setTab(n.id) },
          React.createElement(Icon, { name: n.icon }),
          React.createElement('span', null, n.label))))),
    React.createElement(Toast, { msg: toast }));
}

/* ==================== 首页仪表盘 ==================== */
function Home({ trip, trips, onSwitch, showToast, onGo, onReload }) {
  const [items, setItems] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [checklists, setChecklists] = useState([]);
  const [weather, setWeather] = useState({ status: 'idle', text: '加载中…' });
  const [showTrips, setShowTrips] = useState(false);

  const load = useCallback(async () => {
    if (!trip) return;
    const it = await db.itineraries.where('tripId').equals(trip.id).toArray();
    it.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
    setItems(it);
    const ex = await db.expenses.where('tripId').equals(trip.id).toArray();
    setExpenses(ex);
    const cl = await db.checklists.where('tripId').equals(trip.id).toArray();
    setChecklists(cl.filter(c => c.text));
  }, [trip]);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!trip) return;
    let cancelled = false;
    async function fetchWeather() {
      setWeather({ status: 'loading', text: '正在获取天气…' });
      try {
        const lat = trip.lat || 22.2710, lng = trip.lng || 113.5767;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`;
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        const codeMap = {0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'强阵雨',82:'暴雨',95:'雷暴',96:'雷暴冰雹',99:'强雷暴'};
        const cur = j.current || {};
        const daily = j.daily || {};
        const rows = (daily.time || []).slice(0, 3).map((d, i) => ({
          date: d,
          max: daily.temperature_2m_max?.[i],
          min: daily.temperature_2m_min?.[i],
          rain: daily.precipitation_probability_max?.[i],
          code: codeMap[daily.weather_code?.[i]] || ''
        }));
        if (!cancelled) setWeather({
          status: 'ok',
          text: `${Math.round(cur.temperature_2m)}° ${codeMap[cur.weather_code] || ''}`,
          rows,
          updated: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        });
      } catch (e) {
        if (!cancelled) setWeather({ status: 'error', text: '无法获取天气（需联网，数据源不可用时不编造）' });
      }
    }
    fetchWeather();
    return () => { cancelled = true; };
  }, [trip]);

  if (!trip) {
    return React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'empty' },
        React.createElement('p', null, '还没有旅行项目。'),
        React.createElement('p', { className: 'muted' }, '在「我的」中创建或导入旅行。')));

function ImportPanel({ trip, showToast, onDone }) {
  const [preview, setPreview] = useState([]);
  const [fileName, setFileName] = useState('');
  const [parsing, setParsing] = useState(false);
  const [duplicates, setDuplicates] = useState(new Set());

  const parseFile = async file => {
    setParsing(true); setFileName(file.name);
    try {
      const buf = await file.arrayBuffer();
      let text = '';
      try { text = new TextDecoder('utf-8', { fatal: false }).decode(buf); } catch { text = new TextDecoder('gbk').decode(buf); }
      if ((text.match(/\uFFFD/g) || []).length > 5) { try { text = new TextDecoder('gbk').decode(buf); } catch {} }
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      let headerIdx = -1;
      for (let i = 0; i < Math.min(lines.length, 50); i++) {
        if (/交易时间|交易单号|交易订单号|收\/支|收支类型/.test(lines[i])) { headerIdx = i; break; }
      }
      if (headerIdx < 0) throw new Error('未找到账单表头，请确认是微信或支付宝导出的 CSV。');
      const header = splitCsv(lines[headerIdx]).map(s => s.replace(/^[`\s]+/, '').trim());
      const rows = [];
      for (let i = headerIdx + 1; i < lines.length; i++) {
        const cells = splitCsv(lines[i]).map(s => s.replace(/^[`\s]+/, '').trim());
        if (cells.length < 3) continue;
        const obj = {}; header.forEach((h, idx) => obj[h] = cells[idx] || '');
        const time = obj['交易时间'] || obj['记账时间'] || obj['交易创建时间'] || '';
        const amountRaw = obj['金额'] || obj['收支金额(元)'] || obj['交易金额'] || '';
        const amount = parseFloat(String(amountRaw).replace(/[¥￥,\s]/g, ''));
        if (!time || !amount || isNaN(amount)) continue;
        const typeRaw = obj['收/支'] || obj['收支类型'] || '';
        const isIncome = /收入|收/.test(typeRaw) && !/支出/.test(typeRaw);
        const tradeNo = obj['交易单号'] || obj['交易订单号'] || obj['微信支付业务单号'] || obj['资金流水单号'] || '';
        const counterparty = obj['交易对方'] || obj['对方账户'] || obj['业务名称'] || '';
        const product = obj['商品说明'] || obj['商品'] || obj['备注'] || '';
        const payMethod = obj['收/付款方式'] || obj['支付方式'] || '';
        rows.push({
          key: tradeNo || (time + amount + counterparty),
          date: time.slice(0, 10), time: time.slice(11, 16),
          amount, type: isIncome ? 'income' : 'expense',
          note: (counterparty ? counterparty + ' · ' : '') + (product || '导入记录'),
          category: guessCategory(counterparty + product),
          paymentMethod: /微信/.test(payMethod) ? '微信支付' : /支付宝/.test(payMethod) ? '支付宝' : /银行/.test(payMethod) ? '银行卡' : '其他',
          place: '', tradeNo
        });
      }
      if (rows.length === 0) throw new Error('没有解析到有效记录。');
      const existing = await db.expenses.where('tripId').equals(trip.id).toArray();
      const existKeys = new Set(existing.map(e => e.tradeNo).filter(Boolean));
      const dup = new Set(); rows.forEach(r => { if (existKeys.has(r.tradeNo)) dup.add(r.key); });
      setDuplicates(dup); setPreview(rows);
    } catch (e) { showToast(e.message || '解析失败'); }
    setParsing(false);
  };

  const doImport = async () => {
    const toAdd = preview.filter(r => !duplicates.has(r.key));
    if (toAdd.length === 0) return showToast('没有可导入的新记录');
    if (!confirm(`将导入 ${toAdd.length} 条记录，跳过 ${preview.length - toAdd.length} 条重复/已存在记录。确定？`)) return;
    for (const r of toAdd) await db.expenses.add({ ...r, tripId: trip.id, createdAt: Date.now() });
    showToast(`已导入 ${toAdd.length} 条`); setPreview([]); onDone();
  };

  return React.createElement('div', { className: 'card' },
    React.createElement('div', { className: 'card-title' }, '导入账单'),
    React.createElement('div', { className: 'warn-box' }, '⚠️ 网页无法直接读取微信/支付宝/银行 App 的流水。请在对应 App 中导出 CSV，然后在这里导入。不会要求你提供任何密码。'),
    React.createElement('div', { className: 'muted', style: { marginBottom: 10, lineHeight: 1.6 } },
      '支付宝：我的 → 账单 → 右上角 ··· → 开具交易流水证明 → 用于个人对账，解压得到 CSV。', React.createElement('br'),
      '微信：我 → 服务 → 钱包 → 账单 → 常见问题 → 下载账单 → 用于个人对账，解压得到 CSV。'),
    React.createElement('input', { type: 'file', accept: '.csv,.txt', onChange: e => { const f = e.target.files?.[0]; if (f) parseFile(f); } }),
    parsing ? React.createElement('div', { className: 'muted', style: { marginTop: 8 } }, '正在解析…') : null,
    fileName ? React.createElement('div', { className: 'tiny', style: { marginTop: 6 } }, '文件：' + fileName) : null,
    preview.length > 0 ? React.createElement(React.Fragment, null,
      React.createElement('div', { className: 'row between', style: { marginTop: 12, marginBottom: 6 } },
        React.createElement('span', { style: { fontWeight: 600 } }, `预览 ${preview.length} 条`),
        React.createElement('span', { className: 'chip chip-warn' }, `重复 ${duplicates.size} 条`)),
      preview.map((r, idx) => React.createElement('div', { key: idx, className: 'expense-item', style: { opacity: duplicates.has(r.key) ? .45 : 1 } },
        React.createElement('div', { className: 'grow' },
          React.createElement('div', { style: { fontWeight: 600, fontSize: 13 } }, r.note),
          React.createElement('div', { className: 'tiny' }, `${r.date} ${r.time} · ${r.category} · ${r.paymentMethod}${duplicates.has(r.key) ? ' · 已存在' : ''}`)),
        React.createElement('span', { className: r.type === 'income' ? 'amount-income' : 'amount-expense' }, (r.type === 'income' ? '+' : '-') + fmtMoney(r.amount)))),
      React.createElement('button', { className: 'btn btn-primary', style: { width: '100%', marginTop: 10 }, onClick: doImport }, `确认导入（${preview.length - duplicates.size} 条）`)) : null);
}
function splitCsv(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i + 1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
function guessCategory(text) {
  const t = text || '';
  if (/餐|饭|食|咖啡|奶茶|外卖|美团|饿了么/.test(t)) return '餐饮';
  if (/酒店|民宿|住宿|宾馆|如家/.test(t)) return '住宿';
  if (/地铁|公交|打车|滴滴|高铁|火车|机票|航空|出租|交通/.test(t)) return '交通';
  if (/门票|景区|博物馆/.test(t)) return '门票';
  if (/超市|便利店|日用|药|屈臣氏/.test(t)) return '日用品';
  if (/电影|娱乐|游戏|KTV/.test(t)) return '娱乐';
  if (/话费|流量|通讯/.test(t)) return '通讯';
  if (/淘宝|京东|购物|商场/.test(t)) return '购物';
  return '其他';
}

  useEffect(() => {
    if (!mapRef.current) return;
    if (mapObj.current) { mapObj.current.remove(); mapObj.current = null; }
    const map = L.map(mapRef.current, { zoomControl: true, attributionControl: true }).setView([trip?.lat || 22.2710, trip?.lng || 113.5767], 10);
    mapObj.current = map;
    const tiles = [
      'https://tile.osm-china.net/{z}/{x}/{y}.png',
      'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
    ];
    let tileIndex = 0;
    function addTile() {
      if (tileIndex >= tiles.length) { showToast('地图瓦片加载失败，请检查网络'); return; }
      const layer = L.tileLayer(tiles[tileIndex], { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
      layer.on('tileerror', () => { map.removeLayer(layer); tileIndex++; addTile(); });
    }
    addTile();
    markersRef.current.forEach(m => m.remove()); markersRef.current = [];
    const valid = items.filter(i => i.lat && i.lng);
    if (valid.length > 0) {
      const bounds = [];
      valid.forEach(item => {
        const mk = L.marker([Number(item.lat), Number(item.lng)]).addTo(map);
        const navHtml = `<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          <a href="http://maps.apple.com/?daddr=${item.lat},${item.lng}&q=${encodeURIComponent(item.title)}" target="_blank" style="padding:4px 8px;background:#0284c7;color:#fff;border-radius:6px;text-decoration:none;font-size:12px">Apple 地图</a>

        </div>`;
        mk.bindPopup(`<b>${item.title}</b><br>${item.date || ''} ${item.startTime || ''}<br>${item.address || ''}${navHtml}`);
        markersRef.current.push(mk); bounds.push([Number(item.lat), Number(item.lng)]);
      });
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
    }
    setTimeout(() => map.invalidateSize(), 250);
    return () => { if (mapObj.current) { mapObj.current.remove(); mapObj.current = null; } };
  }, [items, trip]);

  const searchAddress = async () => {
    const q = prompt('输入地点名称搜索（使用 OpenStreetMap Nominatim，需联网）：');
    if (!q) return;
    setGeoState('loading');
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q + ' ' + (trip?.destination || ''))}`, { headers: { 'Accept-Language': 'zh-CN' } });
      const j = await r.json();
      if (!j[0]) throw new Error('未找到结果');
      const { lat, lon, display_name } = j[0];
      if (mapObj.current) mapObj.current.setView([Number(lat), Number(lon)], 14);
      showToast('已定位：' + display_name.slice(0, 30));
    } catch (e) { showToast('搜索失败：' + (e.message || '网络不可用')); }
    setGeoState('idle');
  };

  if (!trip) return React.createElement('div', { className: 'empty' }, '请先创建旅行');
  const withCoords = items.filter(i => i.lat && i.lng).length;

  return React.createElement(React.Fragment, null,
    React.createElement('div', { className: 'row between', style: { marginBottom: 10 } },
      React.createElement('span', { className: 'muted' }, `有坐标地点 ${withCoords} / ${items.length}`),
      React.createElement('button', { className: 'btn btn-sm', onClick: searchAddress, disabled: geoState === 'loading' }, geoState === 'loading' ? '搜索中…' : '搜索地址')),
    React.createElement('div', { className: 'warn-box' }, '地图瓦片来自 OpenStreetMap 镜像，需要联网。离线或瓦片失败时不会显示虚假路线。导航按钮会唤起 Apple 地图或高德地图。'),
    React.createElement('div', { id: 'map', ref: mapRef }),

      React.createElement('div', { className: 'card-title' }, '地点列表'),
      items.length === 0 ? React.createElement('div', { className: 'muted' }, '暂无行程地点。在行程中添加地点并填写经纬度后，会显示在这里。')
